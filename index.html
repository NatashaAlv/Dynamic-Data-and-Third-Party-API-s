<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YGOPRODeck Fuzzy Search</title>
  <style>
    body { font-family: sans-serif; padding: 2em; background: #111; color: #eee; }
    input { padding: 8px; font-size: 16px; width: 300px; border-radius: 6px; border: none; }
    .cards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .card { width: 150px; text-align: center; background: #222; padding: 10px; border-radius: 8px; }
    img { width: 100%; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Yu-Gi-Oh! Card Search</h1>
  <input type="text" id="search" placeholder="Search cards..." />

  <div id="results" class="cards"></div>

  <script>
    const input = document.getElementById("search");
    const results = document.getElementById("results");

    async function searchCards(query) {
      if (!query) {
        results.innerHTML = "";
        return;
      }

      const proxy = "https://corsproxy.io/?";
      const url = `https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(query)}`;

      try {
        const res = await fetch(proxy + url);
        const data = await res.json();

        if (data.data) {
          results.innerHTML = data.data.slice(0, 10).map(card => `
            <div class="card">
              <img src="${card.card_images[0].image_url_small}" alt="${card.name}" />
              <p>${card.name}</p>
            </div>
          `).join("");
        } else {
          results.innerHTML = `<p>No results found.</p>`;
        }

      } catch (err) {
        console.error(err);
        results.innerHTML = `<p>Error fetching cards.</p>`;
      }
    }

    input.addEventListener("input", e => {
      const query = e.target.value.trim();
      searchCards(query);
    });
  </script>
</body>
</html>
